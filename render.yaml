services:
  - type: web
    name: doj-rp-workspace
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && node --check server.mjs && node --check public/app.js
    startCommand: npm start
    healthCheckPath: /api/public
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: HOST
        value: "0.0.0.0"
      - key: COOKIE_SECURE
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DOJ_USERS
        sync: false
