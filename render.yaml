services:
  - type: web
    name: doj-rp-workspace
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: node --check server.mjs && node --check public/app.js
    startCommand: npm start
    healthCheckPath: /api/public
    disk:
      name: doj-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: "/var/data"
      - key: COOKIE_SECURE
        value: "1"
      - key: DOJ_USERS
        sync: false
